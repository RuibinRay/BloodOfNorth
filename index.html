<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blood of the North — Rise of the Raven King</title>
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <canvas id="c" tabindex="0" aria-label="Game view"></canvas>

  <div id="ui">
    <div id="sense"></div>

    <div id="hud">
      <div id="compass"><div id="compass-tick"></div></div>
      <div id="tracker"></div>
      <div id="hint"></div>
      <div id="bars">
        <div class="bar" id="bar-health" title="Health"><i></i></div>
        <div class="bar" id="bar-stamina" title="Stamina"><i></i></div>
        <div class="bar lab" id="bar-warmth" title="Warmth"><i></i><span>Warmth</span></div>
        <div class="bar lab" id="bar-hunger" title="Hunger"><i></i><span>Food</span></div>
        <div class="bar lab" id="bar-ice" title="Ice strain"><i></i><span>Ice strain</span></div>
        <div class="bar lab" id="bar-ward" title="The storm in him: Stormguard and the storm skills spend it"><i></i><span>Storm</span></div>
        <div id="equip"></div>
      </div>
      <div id="toasts"></div>
      <div id="prompt"></div>
      <div id="crosshair"><i></i></div>
      <div id="marker"><b></b><span></span></div>
      <div id="detect"><svg viewBox="0 0 64 32" aria-hidden="true"><path class="lid" d="M2 16 Q32 -8 62 16 Q32 40 2 16Z"/><path class="fill" d="M2 16 Q32 -8 62 16 Q32 40 2 16Z"/><circle cx="32" cy="16" r="6"/></svg><span></span></div>
      <div id="alert">!</div>
      <div id="lock" aria-hidden="true"></div>
      <div id="arts"></div>
      <div id="warn" aria-hidden="true"></div>
      <div id="meter">
        <div class="label"></div>
        <div class="track"><div class="zone"></div><div class="mark"></div></div>
        <div class="reel"><div class="row"><span>Catch</span><div class="rbar"><i id="reel-p"></i></div></div><div class="row"><span>Line</span><div class="rbar strain"><i id="reel-t"></i></div></div></div>
        <div class="hint"></div>
      </div>
      <div id="banner"><small></small><b></b></div>
      <div id="ravenhud"></div>
      <div id="law"></div>
      <div id="target"><b></b><div class="tbar hp"><i></i></div><div class="tbar gd"><i></i></div><em></em></div>
    </div>

    <div id="subtitle"></div>
    <div id="lb-top" class="lb"></div><div id="lb-bot" class="lb"></div>
    <div id="skip"><span>Hold <kbd>Space</kbd> to skip</span><i></i></div>

    <div id="dialogue">
      <div class="speaker"></div>
      <div class="text"></div>
      <div class="choices"></div>
      <div class="next"></div>
    </div>

    <div id="fade"></div>
    <div id="card"><h1></h1><p></p></div>

    <div id="menu" class="screen">
      <div class="menu-inner">
        <div class="runes" aria-hidden="true">ᛒᛚᚢᚦ · ᚢᚠ · ᚦᛖ · ᚾᚢᚱᚦ</div>
        <h1>Blood of the North</h1>
        <h2>Rise of the Raven King</h2>
        <nav id="menu-buttons"></nav>
        <p class="build">Slice 0.14 · Act I, Act II, open-world sandbox · placeholder art &amp; audio</p>
      </div>
    </div>

    <div id="pause" class="screen">
      <div class="menu-inner narrow">
        <h3>Paused</h3>
        <nav id="pause-buttons"></nav>
      </div>
    </div>

    <div id="panel" class="screen">
      <div class="frame">
        <header><nav id="tabs"></nav><button id="panel-close" aria-label="Close">✕</button></header>
        <section id="panel-body"></section>
      </div>
    </div>

    <div id="loading"><div><h1>Blood of the North</h1><p id="loading-text">Raising the valley…</p></div></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
